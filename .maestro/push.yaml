# Expo Go, with `npx expo start` running:
#   maestro test -e APP_ID=host.exp.Exponent -e URL=exp://127.0.0.1:8081 .maestro/push.yaml   (iOS simulator)
#   maestro test -e APP_ID=host.exp.exponent -e URL=exp://127.0.0.1:8081 .maestro/push.yaml   (Android emulator, after adb reverse tcp:8081 tcp:8081)
# Asserts the expected result, so it fails on SDK 58 and passes on SDK 57.
appId: ${APP_ID}
---
- stopApp
- openLink: ${URL}
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible: "Stack: index"
    timeout: 60000
- tapOn: "(?i)push /private"
- waitForAnimationToEnd
- takeScreenshot: push
- assertVisible: "Home #1"
- assertVisible: "Stack: index"
